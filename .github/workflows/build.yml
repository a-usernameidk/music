name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build --stacktrace
      - name: Server smoke test
        run: .github/scripts/server-smoke-test.sh
      - name: Dump Minecraft API signatures
        if: always()
        run: >
          .github/scripts/dump-api.sh
          net.minecraft.client.gui.screens.inventory.AbstractContainerScreen
          net.minecraft.client.gui.screens.Screen
          net.minecraft.client.gui.screens.PauseScreen
          net.minecraft.client.input.KeyEvent
          com.mojang.blaze3d.platform.InputConstants
          net.minecraft.client.gui.Hud
          net.minecraft.client.gui.components.EditBox
          net.minecraft.client.gui.components.Checkbox
          net.minecraft.client.gui.components.CycleButton
          net.minecraft.client.gui.Font
          net.minecraft.client.sounds.JOrbisAudioStream
          net.minecraft.client.resources.sounds.AbstractSoundInstance
          net.minecraft.world.level.block.entity.JukeboxBlockEntity
          net.minecraft.world.item.JukeboxSongPlayer
          net.minecraft.world.item.JukeboxPlayable
          net.minecraft.world.item.EitherHolder
          net.minecraft.world.item.component.TooltipDisplay
          'net.minecraft.world.item.Item$Properties'
          > api-dump.txt; cat api-dump.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            api-dump.txt
            server.log
      - uses: actions/upload-artifact@v4
        with:
          name: custom-discs-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
